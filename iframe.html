<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Tagging - Iframe</title>
  <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
  <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <script src="darkmode.js"></script>
  <!-- Load core tagging library -->
  <script src="ctfe.js"></script>
  <!-- Load page script -->
  <script src="script.js"></script>
</head>

<body>
  <header class="app-header">
    <div class="header-title">Iframe Page (<span id="frameContext">...</span>)</div>
    <div class="theme-switcher">
      <button id="theme-toggle-btn" class="theme-btn">Theme</button>
      <div id="theme-dropdown" class="theme-dropdown-content">
        <button data-theme="light">Light</button>
        <button data-theme="dark">Dark</button>
        <button data-theme="system">System</button>
      </div>
    </div>
  </header>

  <h2>
    This page loads tags: <span id="loadedTags"></span>
  </h2>
  <div>
    The referrer is
    <script>document.write(document.referrer || 'none')</script>
  </div>

  <br />

  <div>
    <button class="mdc-button mdc-button--raised" onclick="nothing = 1"><span class="mdc-button__ripple"></span>click
      w/o gtag()</button>

    <button class="mdc-button mdc-button--raised" onclick="addToCart()">
      <span class="mdc-button__ripple"></span>
      Add to cart event</button>

    <button class="mdc-button mdc-button--raised" onclick="purchase()"><span class="mdc-button__ripple"></span>Purchase
      event</button>
  </div>

  <br />

  <div>
    <h4>Data layer:</h4>
    <pre id="dataLayer"></pre>
  </div>
  <br />
</body>

</html>
